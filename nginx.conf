limit_req_zone $binary_remote_addr zone=landing:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Detrás del proxy de Coolify, confiar en X-Forwarded-For solo desde redes privadas
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    limit_req zone=landing burst=60 nodelay;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;

    # Imágenes y fuentes: revalidan con ETag (la URL no cambia entre deploys)
    location ~* \.(css|js|svg|woff|woff2|png|jpg|jpeg|webp|avif|ico)$ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /index.html;

    # ── Security Headers ──────────────────────────────────────────────────────
    # frame-src: Google Maps embed
    # style-src unsafe-inline: CSS en <style> del HTML
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://maps.gstatic.com https://maps.googleapis.com https://www.google-analytics.com https://www.googletagmanager.com; frame-src https://maps.google.com https://www.google.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com; frame-ancestors 'none'; base-uri 'self'; upgrade-insecure-requests;" always;

    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
}
